name: Update news reader

on:
  schedule:
    # 09:00 UTC = 17:00 Asia/Taipei
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build today's edition
        run: node build.js

      - name: Commit and push if changed
        run: |
          git config user.name "news-reader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
          fi
